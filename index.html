<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascension to Heaven</title>
    <link rel="stylesheet" href="style.css">
    <script src="tabs.js"></script>
    <script src="saveload.js"></script>
    <script src="combat.js"></script>
    <script src="main.js" defer></script>
</head>
<body>
    <div id="notifications-ui">
                                    <!-- ik ew z-index but this ALWAYS needs to be on top -->
        <div id="notifications-wrapper" style="z-index: 99; position: absolute; right: 0px; top: 0px; width: 20%; height: 100%; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none;">

        </div>
    </div>
    <div id="game-ui">
        <div id="cursor-item" class="combat-slot noborder" style="background-color: #fff0; position: absolute; pointer-events: none; z-index: 98;"></div>
        <div id="fixed-panel-left">
            <h1>
                Ascension to Heaven
            </h1>
            <div id="health-bar" class="progress-bar">
                <div id="health-bar-inner" class="progress-bar-inner health"></div>
                <div id="health-bar-text" class="progress-bar-label">idk / idk</div>
            </div><br>
            <div id="essence-bar" class="progress-bar">
                <div id="essence-bar-inner" class="progress-bar-inner essence"></div>
                <div id="essence-bar-text" class="progress-bar-label">idk / idk</div>
            </div><br>
            <div id="qi-bar-menu" class="progress-bar">
                <div id="qi-bar-menu-inner" class="progress-bar-inner qi"></div>
                <div id="qi-bar-menu-text" class="progress-bar-label">idk / idk</div>
            </div><br>
        </div>
        <div id="world-panel">
            <div id="world-tab" class="tab">
                <button id="cultivation-house" class="layer-buttons" style="left: 300px; top: 500px;" onclick="switchTab('cultivation')">
                    Cultivate
                </button>
                <button id="alchemy-house" class="layer-buttons" style="left: 600px; top: -50px;" onclick="switchTab('alchemy')">
                    Alchemy
                </button>
                <button id="combat-tab-button" class="layer-buttons" style="position: absolute; right: 300px; bottom: 100px;" onclick="enterCombat()">
                    Spirit<br>
                    Beasts
                </button>
            </div>
            <div id="cultivation-tab" class="tab image-background" style="display: none; background-image: url(room_cultivation.png);">
                <button id="exit-cultivation-tab" class="layer-buttons" style="left: 150px; top: 100px;" onclick="switchTab('world')">
                    Go outside
                </button>
                <button id="start-cultivation" class="layer-buttons" style="left: calc(50% - 60px); top: 420px; width: 120px; height: 75px;" onclick="startCultivate()">
                    Start<br>
                    Cultivating!
                </button>
            </div>
            <div id="cultivation-in-progress-tab" class="tab" style="display: none;">
                <button id="exit-cultivation-in-progress" class="layer-buttons" style="width: 160px; height: 40px; left: 25px; top: 25px;" onclick="stopCultivate()">
                    Stop Cultivating
                </button>
                <div id="qi-current-stage" style="position: relative; top: calc(75% - 2ch); left: 50%; translate: -50% 0; width: fit-content;">
                    Current stage: Mortal Body
                </div>
                <div id="qi-bar" class="progress-bar" style="position: relative; width: 50%; transform: translate(50%, 0); top: 75%;">
                    <div id="qi-bar-inner" class="progress-bar-inner qi"></div>
                    <div id="qi-bar-text" class="progress-bar-label">idk / idk</div>
                </div>
            </div>
            <div id="alchemy-tab" class="tab" style="display: none;">
                <button id="exit-alchemy-tab" class="layer-buttons" style="left: 100px; top: 100px;" onclick="switchTab('world')">
                    Go outside
                </button>
                <img src="cauldron.png" style="position: absolute; left: calc(65% - 128px); top: 0px;">
                <div style="position: absolute; left: 80%;">SHIFT+click medicine to use it!</div>
                <div id="alchemy-menu" style="position: relative; left: calc(50% - 350px); top: 25%; width: 700px; height: 500px; display: flex; flex-direction: column; justify-content: space-around; align-items: center; background-color: grey; border: 2px solid #333; border-radius: 4px;">
                    <div id="alchemy-slot-crafting" style="display: flex; flex-direction: row; justify-content: space-around;">
                        <div id="alchemy-slot-crafting-grid" style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; width: 300px;">
                            <div id="alchemy-slot-0" class="slot" onclick="clickAlchemySlot(0)"></div>
                            <div id="alchemy-slot-1" class="slot" onclick="clickAlchemySlot(1)"></div>
                            <div id="alchemy-slot-2" class="slot" onclick="clickAlchemySlot(2)"></div>
                            <div id="alchemy-slot-3" class="slot" onclick="clickAlchemySlot(3)"></div>
                            <div id="alchemy-slot-4" class="slot" onclick="clickAlchemySlot(4)"></div>
                        </div>
                        <div style="width: 60px;"></div>
                        <div style="display: flex; flex-direction: column;">
                            <button id="alchemy-recipe" onclick="alchemize()">Alchemize!</button>
                            <span>Success Chance: <span id="alchemy-success-pct"></span></span>
                            <span>Yield: <span id="alchemy-success-yld"></span></span>
                        </div>
                    </div>

                    <div id="alchemy-inventory" style="width: 700px; height: 360px; display: grid; grid-template-rows: 1fr 1fr 1fr auto; grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr auto; padding: 8px; box-sizing: border-box;" class="">
                        <div id="alchemy-inventory-slot-01" class="combat-slot" onclick="clickSlot(0, 0)"></div>
                        <div id="alchemy-inventory-slot-02" class="combat-slot" onclick="clickSlot(0, 1)"></div>
                        <div id="alchemy-inventory-slot-03" class="combat-slot" onclick="clickSlot(0, 2)"></div>
                        <div id="alchemy-inventory-slot-04" class="combat-slot" onclick="clickSlot(0, 3)"></div>
                        <div id="alchemy-inventory-slot-05" class="combat-slot" onclick="clickSlot(0, 4)"></div>
                        <div id="alchemy-inventory-slot-06" class="combat-slot" onclick="clickSlot(0, 5)"></div>
                        <div id="alchemy-inventory-slot-07" class="combat-slot" onclick="clickSlot(0, 6)"></div>
                        <div id="alchemy-inventory-slot-08" class="combat-slot" onclick="clickSlot(0, 7)"></div>

                        <!-- there is like a better way to do this probably -->
                        <div id="alchemy-inventory-slot-11" class="combat-slot" onclick="clickSlot(1, 0)"></div>
                        <div id="alchemy-inventory-slot-12" class="combat-slot" onclick="clickSlot(1, 1)"></div>
                        <div id="alchemy-inventory-slot-13" class="combat-slot" onclick="clickSlot(1, 2)"></div>
                        <div id="alchemy-inventory-slot-14" class="combat-slot" onclick="clickSlot(1, 3)"></div>
                        <div id="alchemy-inventory-slot-15" class="combat-slot" onclick="clickSlot(1, 4)"></div>
                        <div id="alchemy-inventory-slot-16" class="combat-slot" onclick="clickSlot(1, 5)"></div>
                        <div id="alchemy-inventory-slot-17" class="combat-slot" onclick="clickSlot(1, 6)"></div>
                        <div id="alchemy-inventory-slot-18" class="combat-slot" onclick="clickSlot(1, 7)"></div>

                        <div id="alchemy-inventory-slot-21" class="combat-slot" onclick="clickSlot(2, 0)"></div>
                        <div id="alchemy-inventory-slot-22" class="combat-slot" onclick="clickSlot(2, 1)"></div>
                        <div id="alchemy-inventory-slot-23" class="combat-slot" onclick="clickSlot(2, 2)"></div>
                        <div id="alchemy-inventory-slot-24" class="combat-slot" onclick="clickSlot(2, 3)"></div>
                        <div id="alchemy-inventory-slot-25" class="combat-slot" onclick="clickSlot(2, 4)"></div>
                        <div id="alchemy-inventory-slot-26" class="combat-slot" onclick="clickSlot(2, 5)"></div>
                        <div id="alchemy-inventory-slot-27" class="combat-slot" onclick="clickSlot(2, 6)"></div>
                        <div id="alchemy-inventory-slot-28" class="combat-slot" onclick="clickSlot(2, 7)"></div>

                        <div id="alchemy-inventory-slot-31" class="combat-slot" onclick="clickSlot(3, 0)"></div>
                        <div id="alchemy-inventory-slot-32" class="combat-slot" onclick="clickSlot(3, 1)"></div>
                        <div id="alchemy-inventory-slot-33" class="combat-slot" onclick="clickSlot(3, 2)"></div>
                        <div id="alchemy-inventory-slot-34" class="combat-slot" onclick="clickSlot(3, 3)"></div>
                        <div id="alchemy-inventory-slot-35" class="combat-slot" onclick="clickSlot(3, 4)"></div>
                        <div id="alchemy-inventory-slot-36" class="combat-slot" onclick="clickSlot(3, 5)"></div>
                        <div id="alchemy-inventory-slot-37" class="combat-slot" onclick="clickSlot(3, 6)"></div>
                        <div id="alchemy-inventory-slot-38" class="combat-slot" onclick="clickSlot(3, 7)"></div>
                    </div>
                </div>
            </div>
            <div id="combat-tab" class="tab" style="display: none; position: relative;">
                <button id="exit-combat-tab" class="layer-buttons" style="left: 25px; top: 25px; text-align: center; height: 50px; position: absolute;" onclick="exitCombat()">
                    Escape from battle
                </button>
                <div style="position: absolute; width: 100%; top: 128px; display: flex; flex-direction: row; justify-content: space-between;">
                    <div id="cultivator-stats-section" style="flex: 1; margin-left: 16px; height: auto; border: 4px solid black; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-around; align-items: center; padding: 8px; box-sizing: border-box;">
                        <br><b id="cultivator-stats-name">You!</b><br>
                        <div id="combat-c-health-bar" class="progress-bar">
                            <div id="combat-c-health-bar-inner" class="progress-bar-inner health"></div>
                            <div id="combat-c-health-bar-text" class="progress-bar-label">idk / idk</div>
                        </div>
                        <div id="combat-c-essence-bar" class="progress-bar">
                            <div id="combat-c-essence-bar-inner" class="progress-bar-inner essence"></div>
                            <div id="combat-c-essence-bar-text" class="progress-bar-label">idk / idk</div>
                        </div>
                        <div id="combat-c-cd-bar" class="progress-bar">
                            <div id="combat-c-cd-bar-inner" class="progress-bar-inner cooldown"></div>
                            <div id="combat-c-cd-bar-text" class="progress-bar-label">Attack Cooldown</div>
                        </div>
                    </div>
                    <img src="vs.png" alt="">
                    <div id="enemy-stats-section" style="flex: 1; margin-right: 16px; height: auto; border: 4px solid black; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-around; align-items: center; padding: 8px; box-sizing: border-box;">
                        <br><b id="enemy-names-section"></b><br>
                        <div id="combat-e-health-bar" class="progress-bar">
                            <div id="combat-e-health-bar-inner" class="progress-bar-inner health"></div>
                            <div id="combat-e-health-bar-text" class="progress-bar-label">idk / idk</div>
                        </div>
                        <div id="combat-e-cd-bar" class="progress-bar">
                            <div id="combat-e-cd-bar-inner" class="progress-bar-inner cooldown"></div>
                            <div id="combat-e-cd-bar-text" class="progress-bar-label">Attack Cooldown</div>
                        </div>
                    </div>
                </div>
                <div style="position: absolute; display: flex; flex-direction: column-reverse; left: calc(50% - 350px); bottom: 25px; background-color: grey; border: 2px solid #333; border-radius: 4px;">
                    <div id="combat-inventory" style="width: 700px; height: 360px; display: grid; grid-template-rows: 1fr 1fr 1fr auto; grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr auto; padding: 8px; box-sizing: border-box;" class="">
                        <div id="combat-inventory-slot-01" class="combat-slot" onclick="clickSlot(0, 0)"></div>
                        <div id="combat-inventory-slot-02" class="combat-slot" onclick="clickSlot(0, 1)"></div>
                        <div id="combat-inventory-slot-03" class="combat-slot" onclick="clickSlot(0, 2)"></div>
                        <div id="combat-inventory-slot-04" class="combat-slot" onclick="clickSlot(0, 3)"></div>
                        <div id="combat-inventory-slot-05" class="combat-slot" onclick="clickSlot(0, 4)"></div>
                        <div id="combat-inventory-slot-06" class="combat-slot" onclick="clickSlot(0, 5)"></div>
                        <div id="combat-inventory-slot-07" class="combat-slot" onclick="clickSlot(0, 6)"></div>
                        <div id="combat-inventory-slot-08" class="combat-slot" onclick="clickSlot(0, 7)"></div>

                        <!-- there is like a better way to do this probably -->
                        <div id="combat-inventory-slot-11" class="combat-slot" onclick="clickSlot(1, 0)"></div>
                        <div id="combat-inventory-slot-12" class="combat-slot" onclick="clickSlot(1, 1)"></div>
                        <div id="combat-inventory-slot-13" class="combat-slot" onclick="clickSlot(1, 2)"></div>
                        <div id="combat-inventory-slot-14" class="combat-slot" onclick="clickSlot(1, 3)"></div>
                        <div id="combat-inventory-slot-15" class="combat-slot" onclick="clickSlot(1, 4)"></div>
                        <div id="combat-inventory-slot-16" class="combat-slot" onclick="clickSlot(1, 5)"></div>
                        <div id="combat-inventory-slot-17" class="combat-slot" onclick="clickSlot(1, 6)"></div>
                        <div id="combat-inventory-slot-18" class="combat-slot" onclick="clickSlot(1, 7)"></div>

                        <div id="combat-inventory-slot-21" class="combat-slot" onclick="clickSlot(2, 0)"></div>
                        <div id="combat-inventory-slot-22" class="combat-slot" onclick="clickSlot(2, 1)"></div>
                        <div id="combat-inventory-slot-23" class="combat-slot" onclick="clickSlot(2, 2)"></div>
                        <div id="combat-inventory-slot-24" class="combat-slot" onclick="clickSlot(2, 3)"></div>
                        <div id="combat-inventory-slot-25" class="combat-slot" onclick="clickSlot(2, 4)"></div>
                        <div id="combat-inventory-slot-26" class="combat-slot" onclick="clickSlot(2, 5)"></div>
                        <div id="combat-inventory-slot-27" class="combat-slot" onclick="clickSlot(2, 6)"></div>
                        <div id="combat-inventory-slot-28" class="combat-slot" onclick="clickSlot(2, 7)"></div>

                        <div id="combat-inventory-slot-31" class="combat-slot" onclick="clickSlot(3, 0)"></div>
                        <div id="combat-inventory-slot-32" class="combat-slot" onclick="clickSlot(3, 1)"></div>
                        <div id="combat-inventory-slot-33" class="combat-slot" onclick="clickSlot(3, 2)"></div>
                        <div id="combat-inventory-slot-34" class="combat-slot" onclick="clickSlot(3, 3)"></div>
                        <div id="combat-inventory-slot-35" class="combat-slot" onclick="clickSlot(3, 4)"></div>
                        <div id="combat-inventory-slot-36" class="combat-slot" onclick="clickSlot(3, 5)"></div>
                        <div id="combat-inventory-slot-37" class="combat-slot" onclick="clickSlot(3, 6)"></div>
                        <div id="combat-inventory-slot-38" class="combat-slot" onclick="clickSlot(3, 7)"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
